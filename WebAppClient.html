<script>
/* Lesson Grader browser client.
 * - Every server call goes through Api (google.script.run with success AND
 *   failure handlers). Nothing here talks to Google directly.
 * - Data from the server is rendered with textContent only (el()); no
 *   student or AI text is ever parsed as HTML.
 * - Responses for a superseded workbook/task/student are discarded (seq guard),
 *   so switching context can never paint or save the wrong student.
 * - Local storage holds only conveniences (last opened workbook/task); the
 *   workbook in Google Sheets is always the source of truth. */
(function () {
  'use strict';

  var $ = function (id) { return document.getElementById(id); };
  var slice = Array.prototype.slice;

  /* ---------- DOM helpers ------------------------------------------------ */
  function el(tag, attrs, children) {
    var node = document.createElement(tag);
    Object.keys(attrs || {}).forEach(function (k) {
      var v = attrs[k];
      if (v === undefined || v === null || v === false) return;
      if (k === 'text') node.textContent = v;
      else if (k === 'className') node.className = v;
      else if (k === 'checked' || k === 'disabled' || k === 'hidden' || k === 'open' || k === 'selected') node[k] = !!v;
      else if (k === 'value') node.value = v;
      else if (k.indexOf('on') === 0 && typeof v === 'function') node.addEventListener(k.slice(2), v);
      else node.setAttribute(k, v === true ? '' : String(v));
    });
    (Array.isArray(children) ? children : children == null ? [] : [children]).forEach(function (c) {
      if (c == null || c === false) return;
      node.appendChild(typeof c === 'string' || typeof c === 'number' ? document.createTextNode(String(c)) : c);
    });
    return node;
  }
  function clear(node) { while (node && node.firstChild) node.removeChild(node.firstChild); return node; }
  function fill(node, children) { clear(node); (children || []).forEach(function (c) { if (c) node.appendChild(c); }); return node; }
  function fmtDate(iso) {
    if (!iso) return '';
    var d = new Date(iso);
    if (isNaN(d.getTime())) return String(iso);
    try { return d.toLocaleString('en-AU', { timeZone: 'Australia/Sydney', day: 'numeric', month: 'short', year: 'numeric', hour: 'numeric', minute: '2-digit' }); }
    catch (e) { return d.toISOString().slice(0, 16).replace('T', ' '); }
  }
  function fmtNum(n, dp) { var x = Number(n); return isFinite(x) ? x.toFixed(dp == null ? 1 : dp).replace(/\.0+$/, '') : '—'; }
  function safeHttps(url) { return /^https:\/\/(drive|docs|classroom)\.google\.com\//.test(String(url || '')) ? String(url) : ''; }

  /* ---------- convenience storage (never authoritative) ------------------ */
  var Store = {
    get: function (k) { try { return JSON.parse(window.localStorage.getItem('lessonGrader.' + k)); } catch (e) { return null; } },
    set: function (k, v) { try { window.localStorage.setItem('lessonGrader.' + k, JSON.stringify(v)); } catch (e) { /* private mode */ } }
  };

  /* ---------- API wrapper ------------------------------------------------- */
  var Api = (function () {
    var busy = 0;
    function setBusy(delta) { busy = Math.max(0, busy + delta); $('busy').hidden = busy === 0; }
    function call(name) {
      var args = slice.call(arguments, 1);
      setBusy(1);
      return new Promise(function (resolve, reject) {
        try {
          if (!window.google || !google.script || !google.script.run) throw new Error('Open this page through the Apps Script web app address.');
          var runner = google.script.run
            .withSuccessHandler(function (res) { setBusy(-1); resolve(res); })
            .withFailureHandler(function (err) { setBusy(-1); reject(err instanceof Error ? err : new Error(err && err.message || String(err))); });
          if (typeof runner[name] !== 'function') throw new Error('Unknown server action: ' + name);
          runner[name].apply(runner, args);
        } catch (e) { setBusy(-1); reject(e); }
      });
    }
    /* Resolves with res.data (or res); rejects when success === false, keeping the result on err.result. */
    function data() {
      return call.apply(null, arguments).then(function (res) {
        if (!res || res.success === false) {
          var e = new Error(res && res.message || 'The request did not succeed.');
          e.result = res;
          throw e;
        }
        return res.data !== undefined ? res.data : res;
      });
    }
    return { call: call, data: data };
  })();

  /* ---------- notifications & dialogs ------------------------------------ */
  var toastTimer;
  function toast(message, isError) {
    $('toast-text').textContent = message || '';
    $('toast').classList.toggle('error', !!isError);
    $('toast').setAttribute('role', isError ? 'alert' : 'status');
    $('toast').hidden = false;
    clearTimeout(toastTimer);
    if (!isError) toastTimer = setTimeout(function () { $('toast').hidden = true; }, 7000);
  }
  function fail(err) { toast(err && err.message ? err.message : 'Something went wrong.', true); }
  $('toast-close').addEventListener('click', function () { $('toast').hidden = true; });

  var lastFocus = null;
  function openDialog(d) {
    lastFocus = document.activeElement;
    if (typeof d.showModal === 'function') { try { d.showModal(); } catch (e) { d.setAttribute('open', ''); } }
    else d.setAttribute('open', '');
    var first = d.querySelector('input, textarea, button:not([data-close])');
    if (first) first.focus();
  }
  function closeDialog(d) {
    if (typeof d.close === 'function') { try { d.close(); } catch (e) { d.removeAttribute('open'); } }
    d.removeAttribute('open');
    if (lastFocus && lastFocus.focus) lastFocus.focus();
  }
  document.addEventListener('click', function (e) {
    var c = e.target.closest('[data-close]');
    if (c) closeDialog(c.closest('dialog'));
  });

  /** Generic confirmation. actions: [{label, value, primary, danger}] → Promise(value | null). */
  function ask(title, body, actions) {
    return new Promise(function (resolve) {
      var d = $('dlg-confirm');
      $('dlg-confirm-title').textContent = title;
      fill($('confirm-body'), Array.isArray(body) ? body : [typeof body === 'string' ? el('p', { text: body }) : body]);
      var bar = clear($('confirm-actions'));
      (actions || [{ label: 'Cancel', value: null }, { label: 'OK', value: true, primary: true }]).forEach(function (a) {
        bar.appendChild(el('button', { type: 'button', className: 'btn' + (a.primary ? ' primary' : '') + (a.danger ? ' danger' : ''), text: a.label,
          onclick: function () { closeDialog(d); resolve(a.value); } }));
      });
      openDialog(d);
    });
  }

  /* BEGIN SCORING MIRROR — must match RubricEngine.gs; tests/scoring-mirror.test.cjs
     compares both on random rubrics. Display only: the server recalculates on save. */
  var Scoring = (function () {
    var DEFAULT_BANDS = [{ letter: 'A', min: 85 }, { letter: 'B', min: 75 }, { letter: 'C', min: 65 }, { letter: 'D', min: 50 }, { letter: 'E', min: 0 }];
    function normalisePercent(p) { var n = Number(p); return isFinite(n) ? Math.round(n * 1e9) / 1e9 : 0; }
    function overallLetter(percent, bands) {
      var b = bands && bands.length ? bands.slice().sort(function (x, y) { return y.min - x.min; }) : DEFAULT_BANDS;
      var p = normalisePercent(percent);
      for (var i = 0; i < b.length; i++) if (p >= b[i].min) return b[i].letter;
      return b.length ? b[b.length - 1].letter : 'E';
    }
    function scoreCriterion(c, checks, bands) {
      var max = Number(c.maxMarks) || 0;
      function on(id) { return checks[id] === true; }
      if (c.mdOverride && on(c.mdOverride.id)) return { points: max, maxMarks: max, rawPoints: max, percent: 100, grade: overallLetter(100, bands), distinctOverride: true };
      var total = 0;
      (c.bandOrder || []).forEach(function (key) {
        var items = c.bands[key] || [];
        var n = items.filter(function (o) { return on(o.id); }).length;
        if (items.length) total += n * ((max * Number(c.bandWeights[key])) / items.length);
      });
      var raw = total;
      total = Math.min(max, total);
      var pct = normalisePercent(max > 0 ? total / max * 100 : 0);
      return { points: total, maxMarks: max, rawPoints: raw, percent: pct, grade: overallLetter(pct, bands), distinctOverride: false };
    }
    function scoreProfile(profile, states) {
      var bands = profile.gradeScaleBands;
      var out = { criteria: {}, totalPoints: 0, totalMaxMarks: 0 };
      profile.criteria.forEach(function (c) {
        var r = scoreCriterion(c, ((states || {})[c.criterionId] || {}).checkboxes || {}, bands);
        out.criteria[c.criterionId] = r;
        out.totalPoints += r.points;
        out.totalMaxMarks += Number(c.maxMarks) || 0;
      });
      out.percent = normalisePercent(out.totalMaxMarks > 0 ? out.totalPoints / out.totalMaxMarks * 100 : 0);
      out.letter = overallLetter(out.percent, bands);
      return out;
    }
    return { normalisePercent: normalisePercent, overallLetter: overallLetter, scoreCriterion: scoreCriterion, scoreProfile: scoreProfile };
  })();
  /* END SCORING MIRROR */
  window.__lessonGraderScoring = Scoring;

  /* ---------- voice dictation -------------------------------------------- */
  /* Appends recognised speech to the target text box. Never saves, approves or
     publishes; the teacher edits the text and saves deliberately (SC29, SC30). */
  var Dictation = (function () {
    var active = null;
    function Rec() { return window.SpeechRecognition || window.webkitSpeechRecognition || null; }
    function setStatus(id, msg) { var s = document.querySelector('[data-dictation-status="' + id + '"]'); if (s) s.textContent = msg; }
    function join(base, extra) { if (!extra) return base; return base && !/\s$/.test(base) ? base + ' ' + extra : (base || '') + extra; }
    function reset(btn) { btn.setAttribute('aria-pressed', 'false'); btn.textContent = 'Dictate'; }
    function stop() { if (active) { try { active.rec.stop(); } catch (e) { /* already stopped */ } } }
    function toggle(btn) {
      var id = btn.getAttribute('data-dictate');
      var box = $(id);
      if (!box || box.disabled || box.readOnly) return;
      if (active && active.id === id) { stop(); return; }
      stop();
      var R = Rec();
      if (!R) {
        setStatus(id, 'Voice input is not available in this browser. Use your device keyboard\'s microphone key, or type.');
        return;
      }
      var rec = new R();
      rec.lang = 'en-AU'; rec.continuous = true; rec.interimResults = true;
      var base = box.value, finals = '';
      active = { id: id, rec: rec, btn: btn };
      btn.setAttribute('aria-pressed', 'true'); btn.textContent = 'Stop';
      setStatus(id, 'Listening… press Stop when finished. You can edit the text afterwards.');
      rec.onresult = function (ev) {
        var interim = '';
        for (var i = ev.resultIndex; i < ev.results.length; i++) {
          var r = ev.results[i];
          if (r.isFinal) finals = join(finals, String(r[0].transcript).trim());
          else interim += r[0].transcript;
        }
        box.value = join(base, finals);
        box.dispatchEvent(new Event('input', { bubbles: true }));
        setStatus(id, interim ? 'Hearing: ' + interim : 'Listening…');
      };
      rec.onerror = function (ev) {
        var msg = { 'not-allowed': 'Microphone permission was denied. Allow the microphone for this site, or type instead.',
          'service-not-allowed': 'Voice input is blocked on this device. Type instead.',
          'no-speech': 'No speech was heard. Try again, or type.', 'audio-capture': 'No microphone was found.',
          'network': 'Voice input needs a network connection.', 'aborted': 'Voice input stopped.' }[ev.error];
        setStatus(id, msg || 'Voice input stopped (' + ev.error + ').');
        if (active && active.rec === rec) active.errored = true;
      };
      rec.onend = function () {
        var errored = active && active.rec === rec && active.errored;
        if (active && active.rec === rec) active = null;
        reset(btn);
        if (!errored) setStatus(id, finals ? 'Dictation added. Check and edit it, then save.' : 'Dictation stopped.');
      };
      try { rec.start(); } catch (e) { active = null; reset(btn); setStatus(id, 'Voice input could not start: ' + e.message); }
    }
    return { toggle: toggle, stop: stop };
  })();
  document.addEventListener('click', function (e) {
    var b = e.target.closest('[data-dictate]');
    if (b) { e.preventDefault(); Dictation.toggle(b); }
  });

  /* ---------- application state ------------------------------------------ */
  var S = {
    ready: false, user: '', canUnlock: false, workbooks: [], wb: '', task: '', dashboard: null, selected: {},
    studio: null, dirty: false, seq: 0, hash: '', rubricRows: [], rubricSource: '', settings: null, publishPreview: null
  };
  function isNarrow() { return window.matchMedia ? window.matchMedia('(max-width: 1023px)').matches : false; }

  /* ---------- routing ------------------------------------------------------ */
  var VIEWS = ['denied', 'home', 'task', 'studio', 'rubric', 'create', 'link', 'register', 'results', 'settings'];
  function showView(name) {
    VIEWS.forEach(function (v) { var s = $('view-' + v); if (s) s.hidden = v !== name; });
    window.scrollTo(0, 0);
    var h = $('view-' + name) && $('view-' + name).querySelector('h1');
    if (h) { h.setAttribute('tabindex', '-1'); h.focus({ preventScroll: true }); }
  }
  function enc(v) { return encodeURIComponent(v); }
  function taskHash(view, wb, task, sub) { return '#/' + view + '/' + enc(wb) + '/' + enc(task) + (sub ? '/' + enc(sub) : ''); }
  function parseHash(h) {
    var parts = String(h || '').replace(/^#\/?/, '').split('/').map(function (p) { try { return decodeURIComponent(p); } catch (e) { return p; } });
    return { name: parts[0] || 'home', wb: parts[1] || '', task: parts[2] || '', sub: parts[3] || '' };
  }
  var ignoreHash = false;
  function route() {
    if (!S.ready) return; // nothing loads until the teacher's access is confirmed
    if (ignoreHash) { ignoreHash = false; return; }
    var next = location.hash || '#/home';
    if (S.dirty && next !== S.hash) {
      if (!window.confirm('You have unsaved changes for ' + (S.studio ? S.studio.submission.studentName : 'this student') + '. Leave without saving?')) {
        ignoreHash = true; location.hash = S.hash; return;
      }
      setDirty(false);
    }
    Dictation.stop();
    S.hash = next;
    var r = parseHash(next);
    S.seq++;
    switch (r.name) {
      case 'task': return openTask(r.wb, r.task);
      case 'studio': return openStudent(r.wb, r.task, r.sub);
      case 'rubric': return openRubric(r.wb, r.task);
      case 'link': return openLink(r.wb, r.task);
      case 'register': return openRegister(r.wb, r.task);
      case 'results': return openResults(r.wb, r.task);
      case 'create': return openCreate();
      case 'settings': return openSettings();
      default: return openHome();
    }
  }
  /* A hash already rendered (e.g. routed during start-up) is not loaded twice. */
  window.addEventListener('hashchange', function () { if ((location.hash || '#/home') !== S.hash) route(); });
  window.addEventListener('beforeunload', function (e) { if (S.dirty) { e.preventDefault(); e.returnValue = ''; } });
  function go(hash) { if (location.hash === hash) route(); else location.hash = hash; }

  function remember(wb, task, label) { Store.set('last', { wb: wb, task: task, label: label || task, at: new Date().toISOString() }); }

  /* ---------- 1. landing -------------------------------------------------- */
  function loadWorkbooks() {
    return Api.data('apiWebListCandidateWorkbooks').then(function (list) { S.workbooks = list || []; return S.workbooks; });
  }
  function openHome() {
    showView('home');
    fill($('wb-list'), [el('p', { className: 'muted', text: 'Loading workbooks…' })]);
    var mine = S.seq;
    loadWorkbooks().then(function () { if (mine === S.seq) renderHome(); }).catch(function (err) {
      if (mine !== S.seq) return;
      fill($('wb-list'), [el('div', { className: 'banner danger', text: 'Workbooks could not be loaded: ' + err.message }),
        el('button', { type: 'button', className: 'btn', text: 'Try again', onclick: openHome })]);
    });
  }
  function workbookLabel(w) { return w.taskName || w.name; }
  function renderHome() {
    var last = Store.get('last');
    var resume = clear($('resume'));
    if (last && S.workbooks.some(function (w) { return w.id === last.wb; })) {
      var w = S.workbooks.filter(function (x) { return x.id === last.wb; })[0];
      resume.appendChild(el('div', { className: 'card' }, [
        el('h2', { text: 'Resume marking' }),
        el('p', { text: (w.courseCode ? w.courseCode + ' · ' : '') + last.task + ' — last opened ' + fmtDate(last.at) }),
        el('a', { className: 'btn primary', href: taskHash('task', last.wb, last.task), text: 'Resume ' + last.task })
      ]));
    }
    var q = $('wb-search').value.trim().toLowerCase();
    var list = S.workbooks.filter(function (w) {
      return !q || [w.name, w.courseCode, w.year, w.taskName].concat(w.tasks || []).join(' ').toLowerCase().indexOf(q) !== -1;
    });
    if (!S.workbooks.length) {
      fill($('wb-list'), [el('div', { className: 'empty' }, [el('p', { text: 'No grading workbooks yet.' }), el('a', { className: 'btn primary', href: '#/create', text: 'Create one from a Classroom assignment' })])]);
      return;
    }
    if (!list.length) { fill($('wb-list'), [el('div', { className: 'empty', text: 'No workbook matches "' + q + '".' })]); return; }
    fill($('wb-list'), list.map(function (w) {
      var tasks = (w.tasks && w.tasks.length ? w.tasks : [w.taskName]).filter(Boolean);
      return el('article', { className: 'card wb-card' }, [
        el('h3', { text: workbookLabel(w) }),
        el('div', { className: 'meta', text: [w.courseCode, w.year, w.updatedAt ? 'updated ' + fmtDate(w.updatedAt) : ''].filter(Boolean).join(' · ') }),
        el('div', { className: 'row' }, tasks.length ? tasks.map(function (t) {
          return el('a', { className: 'btn' + (tasks.length === 1 ? ' primary' : ''), href: taskHash('task', w.id, t), text: tasks.length === 1 ? 'Open' : t });
        }) : [el('span', { className: 'muted small', text: 'No task tab found' })]),
        el('p', { className: 'small muted', text: w.name })
      ]);
    }));
  }
  $('wb-search').addEventListener('input', renderHome);
  $('refresh-workbooks').addEventListener('click', openHome);

  /* ---------- 2. task dashboard ------------------------------------------- */
  function pillFor(sub) {
    var cls = sub.status === 'Locked' ? 'locked' : sub.status === 'Approved' ? 'approved' : sub.status === 'InReview' ? 'draft' : 'new';
    if (sub.reassessment && cls !== 'approved' && cls !== 'locked') cls = 'reassess';
    return el('span', { className: 'pill ' + cls, text: sub.stateLabel || sub.status });
  }
  function openTask(wb, task) {
    S.wb = wb; S.task = task;
    showView('task');
    $('task-title').textContent = task;
    $('task-crumb').textContent = task;
    $('btn-rubric').href = taskHash('rubric', wb, task);
    $('btn-link').href = taskHash('link', wb, task);
    $('btn-register').href = taskHash('register', wb, task);
    $('btn-results').href = taskHash('results', wb, task);
    fill($('roster'), [el('li', { className: 'muted', text: 'Loading students…' })]);
    var mine = S.seq;
    return Api.data('apiWebTaskDashboard', wb, task).then(function (d) {
      if (mine !== S.seq) return;
      S.dashboard = d;
      remember(wb, task, task);
      renderTask();
      if (d.prepared) refreshQueue();
    }).catch(function (err) {
      if (mine !== S.seq) return;
      fill($('task-banners'), [el('div', { className: 'banner danger', text: 'This task could not be opened: ' + err.message })]);
      clear($('roster'));
    });
  }
  function renderTask() {
    var d = S.dashboard;
    $('task-crumb').textContent = (d.workbook && d.workbook.name ? d.workbook.name + ' › ' : '') + d.taskName;
    fill($('task-chips'), [
      el('span', { className: 'pill ' + (d.profile ? 'approved' : 'block'), text: d.profile ? 'Rubric: ' + d.profile.name + ' (' + d.profile.totalMaxMarks + ' marks)' : 'No active rubric' }),
      el('span', { className: 'pill ' + (d.classroom ? 'neutral' : 'advice'), text: d.classroom ? 'Classroom: ' + d.classroom.assignmentTitle + (d.classroom.dueDate ? ' · due ' + fmtDate(d.classroom.dueDate) : ' · no due date') : 'Not linked to Classroom' }),
      el('span', { className: 'pill neutral', text: d.stats.approved + ' / ' + d.stats.total + ' approved' })
    ]);
    var banners = [];
    if (!d.prepared) banners.push(el('div', { className: 'banner warn' }, [
      el('p', { text: 'This workbook is not ready for web grading. Enabling it first makes a backup copy in Drive, then adds the grading sheets. Existing rows are not changed.' }),
      el('button', { type: 'button', className: 'btn primary', text: 'Back up and enable grading', onclick: enableGrading })]));
    if (d.prepared && !d.profile) banners.push(el('div', { className: 'banner warn' }, [el('span', { text: 'No rubric is active for this task. ' }), el('a', { href: taskHash('rubric', S.wb, S.task), text: 'Review and activate a rubric' })]));
    if (d.stats.evidenceChanged) banners.push(el('div', { className: 'banner info', text: d.stats.evidenceChanged + ' student(s) have new Classroom evidence since their draft or approval. Approved results are unchanged until you reassess.' }));
    if (d.classroom && d.classroom.dueDate && !d.classroom.autoImported) banners.push(el('p', { className: 'small muted', text: 'Automatic import runs hourly after the due date when the sync trigger is installed (Settings). "Sync now" works any time.' }));
    fill($('task-banners'), banners);
    ['btn-sync', 'btn-ai-selected', 'btn-process-queue', 'btn-publish', 'btn-add-student'].forEach(function (id) { $(id).disabled = !d.prepared; });
    $('btn-sync').disabled = !d.prepared || !d.classroom;
    renderRoster();
  }
  function visibleSubmissions() {
    var d = S.dashboard; if (!d) return [];
    var q = $('roster-search').value.trim().toLowerCase();
    var f = $('roster-filter').value, sort = $('roster-sort').value;
    var rank = { New: 0, InReview: 1, Approved: 2, Locked: 3, Superseded: 4 };
    return d.submissions.filter(function (s) {
      if (f !== 'all' && !s.currentOfficial) return false;
      if (f === 'todo' && (s.status === 'Approved' || s.status === 'Locked')) return false;
      if (f === 'draft' && s.status !== 'InReview') return false;
      if (f === 'approved' && s.status !== 'Approved' && s.status !== 'Locked') return false;
      if (f === 'changed' && !s.evidenceChangedAt) return false;
      return !q || (s.studentName + ' ' + s.studentEmail + ' ' + s.className).toLowerCase().indexOf(q) !== -1;
    }).sort(function (a, b) {
      if (sort === 'status') return (rank[a.status] || 0) - (rank[b.status] || 0) || a.studentName.localeCompare(b.studentName);
      if (sort === 'updated') return String(b.updatedAt).localeCompare(String(a.updatedAt));
      return a.studentName.localeCompare(b.studentName) || b.version - a.version;
    });
  }
  function renderRoster() {
    var list = visibleSubmissions();
    if (!S.dashboard.submissions.length) {
      fill($('roster'), [el('li', { className: 'empty' }, [el('span', { text: S.dashboard.classroom ? 'No submissions yet. Press "Sync now" to import from Classroom.' : 'No students yet. Link a Classroom assignment or add students manually.' })])]);
      return;
    }
    if (!list.length) { fill($('roster'), [el('li', { className: 'muted', text: 'No students match this filter.' })]); return; }
    fill($('roster'), list.map(function (s) {
      var meta = [s.className, 'v' + s.version, s.late ? 'late' : '', s.evidenceChangedAt ? 'new evidence' : '', s.published ? s.published : ''].filter(Boolean).join(' · ');
      return el('li', {}, [
        el('input', { type: 'checkbox', 'data-select': s.submissionRecordId, 'aria-label': 'Select ' + s.studentName, checked: !!S.selected[s.submissionRecordId] }),
        el('div', { className: 'who' }, [el('strong', { text: s.studentName }), el('span', { className: 'small', text: meta }), pillFor(s)]),
        el('a', { className: 'btn open', href: taskHash('studio', S.wb, S.task, s.submissionRecordId), text: s.status === 'Approved' || s.status === 'Locked' ? 'View' : 'Mark' })
      ]);
    }));
  }

    var opt = $('create-course').selectedOptions[0];
    var guess = opt ? (/\b(\d{1,2}[A-Za-z][A-Za-z0-9]*)\b/.exec(opt.textContent) || [])[1] : '';
    if (guess && !$('create-code').value) $('create-code').value = guess.toUpperCase();
    loadCoursework($('create-course').value, $('create-coursework')).catch(fail);
  });
  $('create-coursework').addEventListener('change', function () {
    var opt = $('create-coursework').selectedOptions[0];
    if (opt && opt.getAttribute('data-title') && !$('create-task').value) $('create-task').value = opt.getAttribute('data-title').slice(0, 100);
  });
  $('create-form').addEventListener('submit', function (e) {
    e.preventDefault();
    var mode = createMode();
    var errors = [];
    var code = $('create-code').value.trim(), task = $('create-task').value.trim(), year = $('create-year').value.trim(), category = $('create-category').value.trim();
    function check(id, ok, msg) { $(id).classList.toggle('invalid', !ok); if (!ok) errors.push(msg); }
    if (mode === 'classroom') { check('create-course', !!$('create-course').value, 'Choose a class.'); check('create-coursework', !!$('create-coursework').value, 'Choose an assignment.'); }
    check('create-code', /^(7|8|9|10|11|12)/.test(code), 'Course code must start with 7, 8, 9, 10, 11 or 12.');
    check('create-task', !!task && !/[\/\\]/.test(task), 'Enter a task name without slashes.');
    check('create-year', /^20\d{2}$/.test(year), 'Enter a four-digit year.');
    fill($('create-errors'), errors.length ? [el('div', { className: 'banner danger' }, [el('ul', {}, errors.map(function (m) { return el('li', { text: m }); }))])] : []);
    if (errors.length) return;
    Store.set('category', category);
    $('create-submit').disabled = true;
    var req = mode === 'classroom' ?
      Api.data('apiWebCreateFromClassroom', $('create-course').value, $('create-coursework').value, code, task, year, category, $('create-rubric').value) :
      Api.data('apiWebCreateWorkbook', code, task, year, $('create-rubric').value, '', null, category);
    req.then(function (r) {
      toast(r.message);
      var wb = r.workbook.id;
      return loadWorkbooks().then(function () { go(taskHash($('create-rubric').value ? 'rubric' : 'task', wb, task)); });
    }).catch(function (err) { fill($('create-errors'), [el('div', { className: 'banner danger', text: err.message })]); })
      .then(function () { $('create-submit').disabled = false; });
  });

  /* ---------- 6. link Classroom -------------------------------------------- */
  function openLink(wb, task) {
    S.wb = wb; S.task = task;
    showView('link');
    $('link-back').href = taskHash('task', wb, task);
    $('link-title').textContent = 'Link a Classroom assignment to ' + task;
    loadCourses($('link-course')).catch(fail);
    loadCoursework('', $('link-coursework'));
  }
  $('link-course').addEventListener('change', function () { loadCoursework($('link-course').value, $('link-coursework')).catch(fail); });
  $('link-save').addEventListener('click', function () {
    if (!$('link-course').value || !$('link-coursework').value) { toast('Choose a class and an assignment.', true); return; }
    Api.data('apiWebLinkClassroomAssignment', S.wb, S.task, $('link-course').value, $('link-coursework').value).then(function (r) {
      toast(r.message); go(taskHash('task', S.wb, S.task));
    }).catch(fail);
  });

  /* ---------- 7. evaluation / register -------------------------------------- */
  function openRegister(wb, task) {
    S.wb = wb; S.task = task;
    showView('register');
    $('register-back').href = taskHash('task', wb, task);
    $('register-title').textContent = 'Evaluation and register — ' + task;
    var mine = S.seq;
    return checkRegister().then(function () { if (mine !== S.seq) return; });
  }
  function checkRegister() {
    return Api.data('apiWebRegisterPreview', S.wb, S.task, $('register-doc').value.trim()).then(function (p) {
      var c = p.context;
      var pairs = [['Task', c.taskName], ['Course', [c.courseCode, c.year].filter(Boolean).join(' ')], ['Class', c.className], ['Classroom assignment', c.assignmentTitle],
        ['Dates', c.dates], ['Outcomes', c.outcomes || '(none recorded in the rubric)'], ['Grade distribution', c.gradeDistribution]];
      fill($('register-context'), [].concat.apply([], pairs.filter(function (p) { return p[1]; }).map(function (p) { return [el('dt', { text: p[0] }), el('dd', { text: p[1] })]; })));
      $('register-destination').textContent = 'Destination: ' + p.destination.name + (p.destination.type === 'doc' ? ' (a section will be appended)' : '');
      S.registerDestination = p.destination;
      return p;
    }).catch(function (err) { $('register-destination').textContent = err.message; S.registerDestination = null; throw err; });
  }
  $('register-check').addEventListener('click', function () { checkRegister().catch(function () { /* message shown */ }); });
  $('register-commit').addEventListener('click', function () {
    var entry = { teacherEvaluation: $('reg-evaluation').value.trim(), teachingVariations: $('reg-variations').value.trim(), adjustments: $('reg-adjustments').value.trim(), studentFeedbackSummary: $('reg-summary').value.trim() };
    if (!entry.teacherEvaluation) { $('reg-evaluation').classList.add('invalid'); toast('Write or dictate the teacher evaluation first.', true); return; }
    $('reg-evaluation').classList.remove('invalid');
    checkRegister().then(function (p) {
      return ask('Commit this entry?', [el('p', {}, [el('strong', { text: 'Destination: ' }), document.createTextNode(p.destination.name)]),
        el('pre', { className: 'text', text: 'Teacher evaluation: ' + entry.teacherEvaluation + (entry.teachingVariations ? '\nVariations: ' + entry.teachingVariations : '') + (entry.adjustments ? '\nAdjustments: ' + entry.adjustments : '') + (entry.studentFeedbackSummary ? '\nStudent feedback: ' + entry.studentFeedbackSummary : '') })],
        [{ label: 'Keep editing', value: null }, { label: 'Commit', value: true, primary: true }]).then(function (ok) {
        if (!ok) return;
        return Api.call('apiWebRegisterCommit', S.wb, S.task, entry, $('register-doc').value.trim(), true).then(function (r) { toast(r.message, !r.success); });
      });
    }).catch(fail);
  });

  /* ---------- 8. results, messages, samples ---------------------------------- */
  function openResults(wb, task) {
    S.wb = wb; S.task = task;
    showView('results');
    $('results-back').href = taskHash('task', wb, task);
    $('results-title').textContent = 'Class results — ' + task;
    clear($('results-messages')); clear($('samples-list'));
    return Api.data('apiWebGetClassTableData', wb, task).then(function (d) {
      var rows = (d.rows || []).map(function (r) {
        return el('tr', {}, [el('td', { text: r.studentName }), el('td', { text: r.status }), el('td', { text: r.finalScore == null ? '—' : fmtNum(r.finalScore, 2) }), el('td', { text: r.percent == null ? '—' : fmtNum(r.percent, 1) + '%' }), el('td', { text: r.grade })]);
      });
      fill($('results-table'), [el('table', { className: 'simple' }, [el('thead', {}, [el('tr', {}, ['Student', 'State', 'Final', '%', 'Grade'].map(function (h) { return el('th', { scope: 'col', text: h }); }))]), el('tbody', {}, rows)])]);
    }).catch(fail);
  }
  $('results-sync').addEventListener('click', function () { Api.data('apiWebSyncClassTable', S.wb, S.task, { termPair: $('results-term').value.trim() }).then(function (r) { toast(r.message); }).catch(fail); });
  $('results-flags').addEventListener('click', function () {
    Api.data('apiWebFlagIncompleteSubmissions', S.wb, S.task).then(function (f) {
      var list = f.flags.notSubmitted.concat(f.flags.unreadable);
      if (!list.length) { fill($('results-messages'), [el('p', { className: 'banner ok', text: 'Every current submission has files attached.' })]); return; }
      return Api.data('apiWebDraftClassroomMessages', S.wb, S.task, list, 'Please check your files and resubmit.').then(function (dr) {
        fill($('results-messages'), dr.drafts.map(function (m) { return el('div', { className: 'card' }, [el('strong', { text: m.studentName + ' — ' + m.reason }), el('pre', { className: 'text', text: m.message })]); })
          .concat([el('button', { type: 'button', className: 'btn', text: 'Record these drafts in the workbook', onclick: function () {
            Api.data('apiWebSendClassroomMessages', S.wb, S.task, dr.drafts, true).then(function (r) { toast(r.message); }).catch(fail);
          } })]));
      });
    }).catch(fail);
  });
  $('samples-suggest').addEventListener('click', function () {
    Api.data('apiWebSuggestWorkSamples', S.wb, S.task, $('samples-policy').value).then(function (s) {
      S.samples = s.proposals;
      fill($('samples-list'), ['high', 'med', 'low'].map(function (k) { var p = s.proposals[k]; return el('p', { text: k.toUpperCase() + ': ' + p.studentName + ' — ' + p.grade + ', ' + fmtNum(p.percent, 1) + '% (' + p.reason + ')' }); }));
    }).catch(fail);
  });
  $('samples-save').addEventListener('click', function () {
    if (!S.samples) { toast('Suggest samples first.', true); return; }
    var dest = { highFolderId: $('samples-high').value.trim(), medFolderId: $('samples-med').value.trim(), lowFolderId: $('samples-low').value.trim() };
    ask('Copy work samples?', 'Copies of the three students\' first files are placed in the folders. Originals are not changed.', [{ label: 'Cancel', value: null }, { label: 'Copy', value: true, primary: true }]).then(function (ok) {
      if (!ok) return;
      return Api.call('apiWebSaveWorkSamples', S.wb, S.task, S.samples, dest, true).then(function (r) { toast(r.message, !r.success); });
    }).catch(fail);
  });

  /* ---------- 9. settings --------------------------------------------------- */
  function openSettings() {
    showView('settings');
    var mine = S.seq;
    Api.data('apiWebGetSettings').then(function (d) {
      if (mine !== S.seq) return;
      S.settings = d.settings;
      var o = d.settings.outputFormat, a = d.settings.aiProviders;
      $('out-grade').value = o.gradeDisplay; $('out-classroom').value = o.classroomGradeMode;
      $('out-firstname').checked = !!o.useFirstName; $('out-include-grade').checked = !!o.includeGradeInComment;
      $('out-template').value = d.settings.feedbackTemplate || '';
      $('ai-draft').value = a.draftProvider; $('ai-vision').value = a.visionProvider; $('ai-gemini-model').value = a.geminiModel || '';
      $('ai-qwen-model').value = a.qwenModel || ''; $('ai-jev-model').value = a.jevModel || '';
      var p = d.providers;
      $('ai-status').textContent = 'Gemini key: ' + (p.gemini.configured ? 'saved' : 'not set') + ' · Qwen: ' + (p.qwen.configured ? p.qwen.host : 'not set') + ' · JEV: ' + (p.jev.configured ? p.jev.host : 'not set');
    }).catch(fail);
    Api.data('apiWebTriggerStatus').then(function (t) {
      $('trigger-status').textContent = 'Hourly Classroom sync: ' + (t.hourlySync ? 'installed' : 'not installed') + ' · AI queue: ' + (t.aiQueue ? 'installed' : 'not installed') + '. ' + t.note;
    }).catch(function (err) { $('trigger-status').textContent = err.message; });
    loadPrompts();
    var last = Store.get('last');
    if (last && last.wb) {
      Api.data('apiWebGetGradeScale', last.wb).then(function (sc) {
        fill($('scale-view'), [el('p', { text: 'Workbook from "' + last.task + '": boundaries ' + sc.bands.map(function (b) { return b.letter + ' ≥ ' + b.min + '%'; }).join(', ') }),
          el('p', { text: 'Band weights: ' + CORE.map(function (k) { return k + ' ' + Math.round(sc.weights[k] * 1000) / 10 + '%'; }).join(', ') }),
          el('p', { className: 'muted', text: 'Edit the Setup sheet of the workbook to change these. Approved results never change; new rubric versions pick up the new values.' })]);
      }).catch(function () { clear($('scale-view')); });
    } else fill($('scale-view'), [el('p', { className: 'muted', text: 'Open a workbook first.' })]);
  }
  $('health-run').addEventListener('click', function () {
    var last = Store.get('last');
    fill($('health-results'), [el('p', { className: 'muted', text: 'Running…' })]);
    Api.data('apiWebHealthCheck', last && last.wb || '').then(function (h) {
      var label = { pass: '✓', warn: '!', fail: '✗', info: 'i' };
      fill($('health-results'), [el('p', { text: h.counts.pass + ' passed · ' + h.counts.warn + ' warnings · ' + h.counts.fail + ' failed' }),
        el('div', { className: 'table-wrap' }, [el('table', { className: 'simple' }, [el('tbody', {}, h.checks.map(function (c) {
          return el('tr', {}, [el('td', { text: label[c.status] + ' ' + c.status }), el('td', { text: c.area }), el('td', { text: c.check }), el('td', { className: 'small', text: c.detail })]);
        }))])])]);
    }).catch(fail);
  });
  $('triggers-install').addEventListener('click', function () { Api.data('apiWebInstallTriggers').then(function (r) { toast(r.message || 'Done.'); openSettings(); }).catch(fail); });
  $('triggers-remove').addEventListener('click', function () { Api.data('apiWebRemoveTriggers').then(function (r) { toast(r.message || 'Done.'); openSettings(); }).catch(fail); });
  $('out-save').addEventListener('click', function () {
    Api.data('apiWebSaveSettings', { outputFormat: { gradeDisplay: $('out-grade').value, classroomGradeMode: $('out-classroom').value, useFirstName: $('out-firstname').checked, includeGradeInComment: $('out-include-grade').checked },
      feedbackTemplate: $('out-template').value }).then(function () { toast('Output format saved.'); }).catch(fail);
  });
  $('ai-save').addEventListener('click', function () {
    Api.data('apiWebSaveSettings', { aiProviders: { draftProvider: $('ai-draft').value, visionProvider: $('ai-vision').value, geminiModel: $('ai-gemini-model').value.trim(), qwenModel: $('ai-qwen-model').value.trim(), jevModel: $('ai-jev-model').value.trim() } })
      .then(function () { toast('AI provider choices saved.'); }).catch(fail);
  });
  $('gemini-save').addEventListener('click', function () {
    var k = $('gemini-key').value.trim(); if (!k) { toast('Paste a key first.', true); return; }
    Api.data('apiWebSetGeminiKey', k).then(function (r) { $('gemini-key').value = ''; toast(r.message || 'Key saved.'); }).catch(fail);
  });
  function testProvider(name) { $('ai-status').textContent = 'Testing ' + name + '…'; Api.call('apiWebTestAiProvider', name).then(function (r) { $('ai-status').textContent = (r.success ? '✓ ' : '✗ ') + r.message; }).catch(function (err) { $('ai-status').textContent = '✗ ' + err.message; }); }
  $('gemini-test').addEventListener('click', function () { testProvider('gemini'); });
  ['qwen', 'jev'].forEach(function (p) {
    $(p + '-save').addEventListener('click', function () {
      Api.data('apiWebSetAiProviderConfig', p, { endpoint: $(p + '-endpoint').value.trim(), key: $(p + '-key').value.trim() }).then(function () {
        $(p + '-key').value = ''; toast(p.toUpperCase() + ' saved.'); openSettings();
      }).catch(fail);
    });
    $(p + '-test').addEventListener('click', function () { testProvider(p); });
  });
  function loadPrompts() {
    Api.data('apiWebPromptList').then(function (d) {
      fill($('prompt-list'), d.versions.map(function (v) {
        var tests = v.tests || [];
        var last = tests[tests.length - 1];
        return el('div', { className: 'card' }, [
          el('div', { className: 'row between' }, [el('strong', { text: v.id + (v.id === d.active ? ' (active)' : '') }), el('span', { className: 'pill neutral', text: v.status })]),
          v.note ? el('p', { className: 'small', text: v.note }) : null,
          last ? el('p', { className: 'small', text: 'Last test: ' + last.completed + ' case(s), mean agreement ' + (last.meanAgreement == null ? '—' : Math.round(last.meanAgreement * 100) + '%') + ', ' + last.potentialChanges.length + ' potential grade change(s) — not applied.' }) : null,
          el('details', {}, [el('summary', { className: 'small', text: 'Show prompt' }), el('pre', { className: 'text', text: v.text })]),
          el('div', { className: 'row' }, [
            el('button', { type: 'button', className: 'btn small', text: 'Test on current task', onclick: function () {
              var lastCtx = Store.get('last');
              if (!lastCtx) { toast('Open a task with approved work first.', true); return; }
              Api.call('apiWebPromptTest', v.id, lastCtx.wb, lastCtx.task, 3).then(function (r) { toast(r.message, !r.success); loadPrompts(); }).catch(fail);
            } }),
            v.id !== d.active ? el('button', { type: 'button', className: 'btn small', text: 'Activate…', onclick: function () {
              var input = el('input', { type: 'text', 'aria-label': 'Type ACTIVATE' });
              ask('Activate prompt ' + v.id + '?', [el('p', { text: 'New AI drafts will use this prompt. Existing drafts and approvals are not changed. Type ACTIVATE to confirm.' }), input],
                [{ label: 'Cancel', value: null }, { label: 'Activate', value: true, primary: true }]).then(function (ok) {
                if (!ok) return;
                return Api.data('apiWebPromptActivate', v.id, input.value).then(function (r) { toast(r.message); loadPrompts(); });
              }).catch(fail);
            } }) : null
          ])
        ]);
      }));
    }).catch(function (err) { fill($('prompt-list'), [el('p', { className: 'banner danger', text: err.message })]); });
  }
  $('prompt-create').addEventListener('click', function () {
    Api.data('apiWebPromptCreate', $('prompt-text').value, '').then(function (r) { toast(r.message); $('prompt-text').value = ''; loadPrompts(); }).catch(fail);
  });
  $('example-preview').addEventListener('click', function () {
    var last = Store.get('last'); if (!last) { toast('Open a task first so names can be checked against its roster.', true); return; }
    Api.data('apiWebAddRefinementExample', last.wb, last.task, $('example-text').value, false).then(function (r) {
      $('example-result').textContent = r.text; $('example-result').hidden = false; $('example-save').disabled = false;
    }).catch(fail);
  });
  $('example-save').addEventListener('click', function () {
    var last = Store.get('last'); if (!last) return;
    Api.data('apiWebAddRefinementExample', last.wb, last.task, $('example-text').value, true).then(function (r) {
      toast(r.message); $('example-text').value = ''; $('example-result').hidden = true; $('example-save').disabled = true;
    }).catch(fail);
  });
  $('example-text').addEventListener('input', function () { $('example-save').disabled = true; });

  /* ---------- start ---------------------------------------------------------- */
  function init() {
    if (window.__LESSON_GRADER_PREVIEW__) {
      document.body.classList.add('preview-mode');
      ['gemini-key', 'gemini-save', 'qwen-key', 'jev-key', 'upload-rubric'].forEach(function (id) { $(id).disabled = true; });
    }
    Api.data('apiWebAuthStatus').then(function (a) {
      if (!a.authorised) { showView('denied'); return; }
      S.user = a.email; S.canUnlock = !!a.canUnlock; S.ready = true;
      $('who').textContent = a.email;
      route();
    }).catch(function (err) { $('denied-detail').textContent = err.message; showView('denied'); });
  }
  $('retry-auth').addEventListener('click', init);
  init();
})();
</script>
